openapi: 3.0.3

info:
  title: Claim Service API
  description: >
    Claim Service manages the lifecycle of food claims made by NGOs
    against food listings created by donors.
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local development

tags:
  - name: Claims
    description: Claim lifecycle APIs

paths:
  /claims:
    post:
      tags: [Claims]
      summary: Create a claim for a food listing
      description: NGO requests a food listing.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: NGO not verified
        "409":
          description: Active claim already exists or invalid state
        "500":
          description: Internal server error

  /claims/{id}/approve:
    post:
      tags: [Claims]
      summary: Approve a claim
      description: Donor approves a claim request.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "204":
          description: Claim approved
        "401":
          description: Unauthorized
        "403":
          description: Not claim owner
        "404":
          description: Claim not found
        "409":
          description: Invalid state transition
        "500":
          description: Internal server error

  /claims/{id}/reject:
    post:
      tags: [Claims]
      summary: Reject a claim
      description: Donor rejects a claim request.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "204":
          description: Claim rejected
        "401":
          description: Unauthorized
        "403":
          description: Not claim owner
        "404":
          description: Claim not found
        "409":
          description: Invalid state transition
        "500":
          description: Internal server error

  /claims/{id}/cancel:
    post:
      tags: [Claims]
      summary: Cancel a claim
      description: NGO cancels a claim.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "204":
          description: Claim cancelled
        "401":
          description: Unauthorized
        "403":
          description: Not claim owner
        "404":
          description: Claim not found
        "409":
          description: Invalid state transition
        "500":
          description: Internal server error

  /claims/{id}/pickup:
    post:
      tags: [Claims]
      summary: Mark claim as picked up
      description: NGO marks food as picked up.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "204":
          description: Food picked up
        "401":
          description: Unauthorized
        "403":
          description: Not claim owner
        "404":
          description: Claim not found
        "409":
          description: Invalid state transition
        "500":
          description: Internal server error

  /claims/{id}/deliver:
    post:
      tags: [Claims]
      summary: Mark claim as delivered
      description: NGO confirms delivery of food.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "204":
          description: Food delivered
        "401":
          description: Unauthorized
        "403":
          description: Not claim owner
        "404":
          description: Claim not found
        "409":
          description: Invalid state transition
        "500":
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClaimId:
      name: id
      in: path
      required: true
      description: Claim ID
      schema:
        type: string
        format: uuid

  schemas:
    CreateClaimRequest:
      type: object
      required:
        - foodListingId
      properties:
        foodListingId:
          type: string
          format: uuid
          example: "9f2a6b2d-9d7b-4c3a-9c4e-4b2a9c1f1234"

    Claim:
      type: object
      properties:
        id:
          type: string
          format: uuid
        foodListingId:
          type: string
          format: uuid
        ngoUserId:
          type: string
          format: uuid
        donorUserId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - REQUESTED
            - APPROVED
            - REJECTED
            - CANCELLED
            - PICKED_UP
            - DELIVERED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
