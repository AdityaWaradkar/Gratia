openapi: 3.0.3

info:
  title: Gratia Authentication Service API
  version: 1.0.0
  description: |
    Authentication and authorization service for the Gratia platform.

    Features:
    - User registration
    - JWT authentication
    - Refresh token rotation
    - Session management
    - Password reset workflows
    - Protected user endpoints

  contact:
    name: Aditya Waradkar
    email: aditya@example.com

servers:
  - url: http://localhost:8080
    description: Local Development

  - url: https://auth.gratia.dev
    description: Development Server

tags:
  - name: Authentication
    description: Authentication and token management

  - name: User
    description: Authenticated user operations

  - name: Password
    description: Password recovery and reset

  - name: Monitoring
    description: Health monitoring endpoints

security:
  - BearerAuth: []

paths:

  /auth/register:
    post:
      summary: Register a new user
      description: Creates a new authenticated user account.
      operationId: registerUser

      security: []

      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '400':
          description: Invalid request or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login user
      description: Authenticates user and issues JWT access and refresh tokens.
      operationId: loginUser

      security: []

      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh authentication tokens
      description: Rotates refresh token and issues new access token.
      operationId: refreshTokens

      security: []

      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'

      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout authenticated session
      description: Revokes refresh token and invalidates session.
      operationId: logoutUser

      security: []

      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'

      responses:
        '204':
          description: Logout successful

        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Get current authenticated user
      description: Returns currently authenticated user details.
      operationId: getCurrentUser

      tags:
        - User

      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      summary: Generate password reset token
      description: Creates password reset token for account recovery.
      operationId: forgotPassword

      security: []

      tags:
        - Password

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'

      responses:
        '200':
          description: Reset token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'

        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      summary: Reset account password
      description: Resets password using valid reset token.
      operationId: resetPassword

      security: []

      tags:
        - Password

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'

      responses:
        '204':
          description: Password reset successful

        '400':
          description: Invalid reset token or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Service health check
      operationId: healthCheck

      security: []

      tags:
        - Monitoring

      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    example: ok

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      additionalProperties: false

      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          example: user@example.com

        password:
          type: string
          minLength: 8
          example: Password123!

        role:
          type: string
          enum:
            - USER
            - ADMIN
          default: USER

    LoginRequest:
      type: object
      additionalProperties: false

      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email

        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      additionalProperties: false

      required:
        - refreshToken

      properties:
        refreshToken:
          type: string

    ForgotPasswordRequest:
      type: object
      additionalProperties: false

      required:
        - email

      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      additionalProperties: false

      required:
        - token
        - newPassword

      properties:
        token:
          type: string

        newPassword:
          type: string
          minLength: 8

    TokenPair:
      type: object

      properties:
        accessToken:
          type: string

        refreshToken:
          type: string

    UserResponse:
      type: object

      properties:
        id:
          type: string
          format: uuid

        email:
          type: string
          format: email

        role:
          type: string
          enum:
            - USER
            - ADMIN

        emailVerified:
          type: boolean

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    PasswordResetResponse:
      type: object

      properties:
        resetToken:
          type: string

    ErrorResponse:
      type: object

      properties:
        message:
          type: string