version: '3.8'

services:
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    image: adityawaradkar9326/gratia:auth-latest
    container_name: gratia_auth
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_MINUTES=15
      - REFRESH_TOKEN_DAYS=30
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - gratia_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  user_service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    image: adityawaradkar9326/gratia:user-latest
    container_name: gratia_user
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DATABASE_URL=${USER_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - auth_service
    networks:
      - gratia_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  food_service:
    build:
      context: ./food_service
      dockerfile: Dockerfile
    image: adityawaradkar9326/gratia:food-latest
    container_name: gratia_food
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DATABASE_URL=${FOOD_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user_service:8081
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - auth_service
      - user_service
    networks:
      - gratia_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  claim_service:
    build:
      context: ./claim_service
      dockerfile: Dockerfile
    image: adityawaradkar9326/gratia:claim-latest
    container_name: gratia_claim
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DATABASE_URL=${CLAIM_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_URL=http://user_service:8081
      - FOOD_SERVICE_URL=http://food_service:8082
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - auth_service
      - user_service
      - food_service
    networks:
      - gratia_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  gratia_network:
    driver: bridge